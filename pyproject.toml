[project]
name = "ai-illustration-studio"
version = "0.1.0"
description = "Local SDXL image generation, scene planning, candidate review, and multi-panel illustration composition."
requires-python = ">=3.11,<3.13"
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "pillow>=10.0",
  "torch",
  "diffusers>=0.30",
  "transformers>=4.44",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "peft>=0.12",
]

# Windows + NVIDIA GPU environments use the CUDA-enabled PyTorch index.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
package = false
